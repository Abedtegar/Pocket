; Firmware kacamata Guardian - Seeed XIAO ESP32S3 Sense (plan.md bagian 5)
; ESP hanya: streaming kamera MJPEG (:81/stream) + heart rate/status/tuning lewat MQTT.
; Semua logika (deteksi, alarm, notifikasi) ada di pocket device (Orange Pi).
;
;   pio run              <- build
;   pio run -t upload    <- upload firmware
;   pio device monitor   <- serial 115200

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; app 3 MB: lega untuk kamera + WiFi + MQTT.
board_build.partitions = huge_app.csv

; PSRAM 8 MB octal di XIAO S3: wajib untuk frame buffer kamera ganda.
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
  bblanchon/ArduinoJson @ ^7.4.3
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
  knolleary/PubSubClient @ ^2.8
