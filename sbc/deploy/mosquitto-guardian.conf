# /etc/mosquitto/conf.d/guardian.conf
# Mendengar di semua antarmuka karena IP Orange Pi di Wi-Fi modem diberikan DHCP (berubah-ubah).
# Kacamata mencari broker lewat mDNS: guardian.local. Lindungi Wi-Fi modem dengan password WPA2 yang kuat.
listener 1883 0.0.0.0
allow_anonymous true
persistence true
